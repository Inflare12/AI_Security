services:
  model:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../workspace:/app/workspace:rw
      - ../airlock:/app/airlock:ro
    # Strong default: the model process has no network interface at all.
    network_mode: "none"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    command: ["python", "-c", "print('Replace this with your local model runner')"]
