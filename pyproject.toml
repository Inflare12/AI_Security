[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-airlock"
version = "1.1.1"
description = "Local-first capability control, containment and API shielding for AI runtimes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
shield = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "fastapi>=0.115,<1", "httpx>=0.27,<1"]
security = ["pip-audit>=2.7,<3", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["airlock*", "shield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
